services:
  docmost:
    build: .
    image: docmost/docmost:local
    depends_on:
      - db
      - redis
    environment:
      APP_URL: 'http://localhost:3010'
      APP_SECRET: 'REPLACE_WITH_LONG_SECRET'
      DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
      # Local/embedded-preview only: skips login and treats every request as
      # the workspace's first user. Never set this on anything reachable
      # beyond this machine's LAN test setup.
      DISABLE_AUTH: 'true'
    ports:
      - "3010:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
